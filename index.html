<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Rodders Thursday Tournaments</title>
  <meta name="description" content="Current signup and redirect hub for Rodders Thursday Tournaments.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Rodders Thursday Tournaments">
  <meta property="og:description" content="Current signup and redirect hub for Rodders Thursday Tournaments.">
  <meta property="og:url" content="https://rackresponsibly.com/">
  <meta property="og:site_name" content="Rodders Thursday Tournaments">
  <meta property="og:image" content="https://rackresponsibly.com/Rodder%27s%20Thursday%20Flyer.jpeg">
  <meta property="og:image:width" content="1369">
  <meta property="og:image:height" content="1149">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Rodders Thursday Tournaments">
  <meta name="twitter:description" content="Current signup and redirect hub for Rodders Thursday Tournaments.">
  <meta name="twitter:image" content="https://rackresponsibly.com/Rodder%27s%20Thursday%20Flyer.jpeg">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5ef;
      --bg-accent: #e4ece3;
      --panel: rgba(255, 255, 255, 0.88);
      --text: #243036;
      --muted: #66737b;
      --accent: #0f5f4e;
      --accent-strong: #0a4639;
      --border: rgba(36, 48, 54, 0.1);
      --shadow: 0 18px 50px rgba(36, 48, 54, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", Times, serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.92), transparent 32%),
        radial-gradient(circle at 80% 20%, rgba(15, 95, 78, 0.15), transparent 30%),
        linear-gradient(145deg, var(--bg), var(--bg-accent));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    body.redirecting {
      background: #fbfaf6;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(circle at center, black, transparent 88%);
      opacity: 0.5;
    }

    main {
      width: min(640px, 100%);
      position: relative;
      z-index: 1;
    }

    body.redirecting main {
      width: auto;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: clamp(28px, 6vw, 48px);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    body.redirecting .card {
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
      backdrop-filter: none;
      text-align: center;
    }

    .kicker {
      margin: 0 0 12px;
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.74rem;
      color: var(--accent);
    }

    body.redirecting .kicker {
      display: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 6vw, 4.6rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    body.redirecting h1 {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.98rem;
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.3;
      color: var(--muted);
    }

    .lead {
      margin: 18px 0 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(1.05rem, 2.7vw, 1.2rem);
      line-height: 1.55;
      color: var(--muted);
      max-width: 34rem;
    }

    body.redirecting .lead,
    body.redirecting .note,
    body.redirecting .action {
      display: none !important;
    }

    body.redirecting.show-fallback-link .action {
      display: block !important;
      margin-top: 0.55rem;
    }

    body.redirecting.show-fallback-link .button {
      min-height: 0;
      padding: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 400;
      text-decoration: underline;
    }

    body.redirecting.show-fallback-link .button:hover,
    body.redirecting.show-fallback-link .button:focus-visible {
      transform: none;
      background: transparent;
      color: var(--text);
    }

    .action {
      margin-top: 28px;
      display: none;
    }

    .action.is-visible {
      display: block;
      animation: fade-up 180ms ease-out;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0.85rem 1.25rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      box-shadow: 0 12px 24px rgba(15, 95, 78, 0.18);
      transition: transform 120ms ease, background 120ms ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-1px);
      background: var(--accent-strong);
    }

    .note {
      margin: 16px 0 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--muted);
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 16px;
      }

      .card {
        border-radius: 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-live="polite">
      <p class="kicker">Civilized Pool</p>
      <h1 id="page-title">Finding this week's tournament...</h1>
      <p class="lead" id="page-lead">Please wait while we look up the current Rodder's tournament signup link.</p>
      <div class="action" id="page-action"></div>
      <p class="note" id="page-note"></p>
    </section>
  </main>
  <script src="redirect.js"></script>
</body>
</html>
